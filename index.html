<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barn | August 2026 Quote Album</title>

<style>
  body {
    background: #121212;
    color: #f0f0f0;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }

  header {
    text-align: center;
    padding: 20px;
    background: #1e1e1e;
  }

  h1 {
    margin: 0;
    font-weight: 300;
  }

  h2 {
    margin: 10px 20px;
    font-weight: 300;
    border-bottom: 1px solid #333;
    padding-bottom: 5px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    padding: 20px;
  }

  .thumb {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
  }

  .thumb:hover {
    opacity: 0.8;
  }

  /* LIGHTBOX */
  #lightbox {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
  }

  #lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 6px;
  }

  .nav {
    position: absolute;
    top: 50%;
    font-size: 50px;
    color: white;
    cursor: pointer;
    user-select: none;
  }

  #prev { left: 30px; }
  #next { right: 30px; }

  #close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 40px;
    color: white;
    cursor: pointer;
  }
</style>
</head>

<body>

<header>
  <h1>Barn | August 2026 Quote Album</h1>
</header>

<!-- ================= FRONT SECTION ================= -->
<h2>Front Elevation</h2>
<div class="gallery">
  <img class="thumb" src="Front Barn Cladding Whole 1.jpg" alt="">
  <img class="thumb" src="Front Barn Cladding Whole 2.jpg" alt="">
  <img class="thumb" src="Front Barn Cladding Main Door.jpg" alt="">
  <img class="thumb" src="Front Barn Kitchen Stable Door Windows.jpg" alt="">
  <img class="thumb" src="Front Barn Leading Gutter Kitchen Window.jpg" alt="">
  <img class="thumb" src="Front Barn Left Roof Edge 1.jpg" alt="">
  <img class="thumb" src="Front Barn Left Roof Edge 2.jpg" alt="">
  <img class="thumb" src="Front Barn Main Door.jpg" alt="">
  <img class="thumb" src="Front Barn Right Kitchen Stable Door.jpg" alt="">
  <img class="thumb" src="Front Barn Roof Edge Kitchen Door.jpg" alt="">
</div>

<!-- ================= REAR SECTION ================= -->
<h2>Rear Elevation</h2>
<div class="gallery">
  <img class="thumb" src="Rear Barn Access.jpg" alt="">
  <img class="thumb" src="Rear Barn Chimney 1.jpg" alt="">
  <img class="thumb" src="Rear Barn Chimney 2.jpg" alt="">
  <img class="thumb" src="Rear Barn Cladding Middle.jpg" alt="">
  <img class="thumb" src="Rear Barn Cladding Utility Door 1.jpg" alt="">
  <img class="thumb" src="Rear Barn Cladding Utility Door 2.jpg" alt="">
  <img class="thumb" src="Rear Barn Cladding Whole.jpg" alt="">
  <img class="thumb" src="Rear Barn Closeup Left Barn Door 1.jpg" alt="">
  <img class="thumb" src="Rear Barn Closeup Right Barn Door 1.jpg" alt="">
  <img class="thumb" src="Rear Barn Closeup Right Barn Door 2.jpg" alt="">
  <img class="thumb" src="Rear Barn Large Window Sill Right Barn Door.jpg" alt="">
  <img class="thumb" src="Rear Barn Left Barn Door.jpg" alt="">
  <img class="thumb" src="Rear Barn Right Barn Door.jpg" alt="">
</div>

<!-- ================= RIGHT SIDE SECTION ================= -->
<h2>Right Side Elevation</h2>
<div class="gallery">
  <img class="thumb" src="Right Barn Side Path Access.jpg" alt="">
  <img class="thumb" src="Right Barn Side Path Cladding 1.jpg" alt="">
  <img class="thumb" src="Right Barn Side Path Cladding 2.jpg" alt="">
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span id="close">&times;</span>
  <span id="prev" class="nav">&#10094;</span>

  <div id="lightbox-content">
    <img id="lightbox-img" src="">
    <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1">
  </div>

  <span id="next" class="nav">&#10095;</span>
</div>

<style>
  #lightbox-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  #zoom-slider {
    width: 300px;
    cursor: pointer;
  }

  #lightbox-img {
    transition: transform 0.1s ease-out;
  }
</style>

<script>
  const images = [...document.querySelectorAll('.thumb')];
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const zoomSlider = document.getElementById('zoom-slider');
  let index = 0;

  function showLightbox(i) {
    index = i;
    lightboxImg.src = images[i].src;

    // Reset zoom when opening a new image
    zoomSlider.value = 1;
    lightboxImg.style.transform = "scale(1)";

    lightbox.style.display = 'flex';
  }

  images.forEach((img, i) => {
    img.addEventListener('click', () => showLightbox(i));
  });

  document.getElementById('close').onclick = () => {
    lightbox.style.display = 'none';
  };

  document.getElementById('next').onclick = () => {
    index = (index + 1) % images.length;
    showLightbox(index);
  };

  document.getElementById('prev').onclick = () => {
    index = (index - 1 + images.length) % images.length;
    showLightbox(index);
  };

  // Zoom slider logic
  zoomSlider.addEventListener('input', () => {
    const zoom = zoomSlider.value;
    lightboxImg.style.transform = `scale(${zoom})`;
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') lightbox.style.display = 'none';
    if (e.key === 'ArrowRight') document.getElementById('next').click();
    if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  });
</script>

</body>
</html>

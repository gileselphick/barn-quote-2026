<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barn | August 2026 Quote Album</title>

<style>
  body {
    background: #121212;
    color: #f0f0f0;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }

  header {
    text-align: center;
    padding: 20px;
    background: #1e1e1e;
  }

  h1 {
    margin: 0;
    font-weight: 300;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    padding: 20px;
  }

  .thumb {
    width: 100%;
    height: 180px;
    object-fit: cover; /* makes vertical + horizontal images uniform */
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
  }

  .thumb:hover {
    opacity: 0.8;
  }

  /* LIGHTBOX */
  #lightbox {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
  }

  #lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 6px;
  }

  .nav {
    position: absolute;
    top: 50%;
    font-size: 50px;
    color: white;
    cursor: pointer;
    user-select: none;
  }

  #prev { left: 30px; }
  #next { right: 30px; }

  #close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 40px;
    color: white;
    cursor: pointer;
  }
</style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stonehouse Barn | Exterior Decoration Quote Album</title>

<style>
  body {
    background: #121212;
    color: #f0f0f0;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }

  header {
    text-align: center;
    padding: 20px;
    background: #1e1e1e;
  }

  h1 {
    margin: 0;
    font-weight: 300;
  }

  h2 {
    margin: 10px 20px;
    font-weight: 300;
    border-bottom: 1px solid #333;
    padding-bottom: 5px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    padding: 20px;
  }

  .thumb {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
  }

  .thumb:hover {
    opacity: 0.8;
  }

  /* LIGHTBOX OVERLAY */
  #lightbox {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.9);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 999;
  }

  #viewport {
    width: 90vw;
    height: 75vh;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #pan-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: grab;
  }

  #lightbox-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transform-origin: center center;
    transition: transform 0.1s ease-out;
    pointer-events: none;
  }

  #zoom-controls {
    margin-top: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2000;
  }

  #zoom-slider {
    width: 300px;
  }

  .nav {
    position: absolute;
    top: 50%;
    font-size: 50px;
    color: white;
    cursor: pointer;
    user-select: none;
    z-index: 3000;
  }

  #prev { left: 30px; }
  #next { right: 30px; }

  #close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 40px;
    color: white;
    cursor: pointer;
    z-index: 4000;
  }

  /* PIN MODAL */
  #pin-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10000;
  }

  #pin-modal {
    background: #1e1e1e;
    padding: 25px 30px;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,0,0,0.7);
    max-width: 320px;
    width: 90%;
    text-align: center;
  }

  #pin-modal h2 {
    margin: 0 0 15px;
    font-weight: 300;
    border: none;
    padding: 0;
  }

  #pin-input {
    padding: 10px;
    font-size: 18px;
    width: 100%;
    text-align: center;
    border-radius: 6px;
    border: none;
    outline: none;
    margin-bottom: 15px;
    box-sizing: border-box;
  }

  #pin-submit {
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #f0f0f0;
    color: #111;
    width: 100%;
  }

  #pin-error {
    color: #ff6b6b;
    margin-top: 10px;
    min-height: 18px;
    font-size: 14px;
  }

  #pin-denied {
    color: #ff6b6b;
    margin-top: 10px;
    font-size: 14px;
  }
</style>
</head>

<body>

<!-- PIN OVERLAY -->
<div id="pin-overlay">
  <div id="pin-modal">
    <h2>Enter Access PIN</h2>
    <input id="pin-input" type="password" placeholder="PIN">
    <button id="pin-submit">Submit</button>
    <div id="pin-error"></div>
    <div id="pin-denied" style="display:none;">Access denied: invalid link token.</div>
  </div>
</div>

<header>
  <h1>Stonehouse Barn | Exterior Decoration Quote Album</h1>
</header>

<h2>Front Elevation</h2>
<div class="gallery">
  <img class="thumb" src="Front Barn Cladding Whole 1.jpg" alt="">
  <img class="thumb" src="Front Barn Cladding Whole 2.jpg" alt="">
  <img class="thumb" src="Front Barn Cladding Main Door.jpg" alt="">
  <img class="thumb" src="Front Barn Kitchen Stable Door Windows.jpg" alt="">
  <img class="thumb" src="Front Barn Leading Gutter Kitchen Window.jpg" alt="">
  <img class="thumb" src="Front Barn Left Roof Edge 1.jpg" alt="">
  <img class="thumb" src="Front Barn Left Roof Edge 2.jpg" alt="">
  <img class="thumb" src="Front Barn Main Door.jpg" alt="">
  <img class="thumb" src="Front Barn Right Kitchen Stable Door.jpg" alt="">
  <img class="thumb" src="Front Barn Roof Edge Kitchen Door.jpg" alt="">
</div>

<h2>Rear Elevation</h2>
<div class="gallery">
  <img class="thumb" src="Rear Barn Access.jpg" alt="">
  <img class="thumb" src="Rear Barn Chimney 1.jpg" alt="">
  <img class="thumb" src="Rear Barn Chimney 2.jpg" alt="">
  <img class="thumb" src="Rear Barn Cladding Middle.jpg" alt="">
  <img class="thumb" src="Rear Barn Cladding Utility Door 1.jpg" alt="">
  <img class="thumb" src="Rear Barn Cladding Utility Door 2.jpg" alt="">
  <img class="thumb" src="Rear Barn Cladding Whole.jpg" alt="">
  <img class="thumb" src="Rear Barn Closeup Left Barn Door 1.jpg" alt="">
  <img class="thumb" src="Rear Barn Closeup Right Barn Door 1.jpg" alt="">
  <img class="thumb" src="Rear Barn Closeup Right Barn Door 2.jpg" alt="">
  <img class="thumb" src="Rear Barn Large Window Sill Right Barn Door.jpg" alt="">
  <img class="thumb" src="Rear Barn Left Barn Door.jpg" alt="">
  <img class="thumb" src="Rear Barn Right Barn Door.jpg" alt="">
</div> 

<h2>Right Side Elevation</h2>
<div class="gallery">
  <img class="thumb" src="Right Barn Side Path Access.jpg" alt="">
  <img class="thumb" src="Right Barn Side Path Cladding 1.jpg" alt="">
  <img class="thumb" src="Right Barn Side Path Cladding 2.jpg" alt="">
</div>

<h2>Roof Work</h2>
<div class="gallery">
  <img class="thumb" src="Front Barn Kitchen Roof Verge 1.jpeg" alt="">
  <img class="thumb" src="Front Barn Kitchen Roof Verge 2.jpeg" alt="">
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span id="close">&times;</span>
  <span id="prev" class="nav">&#10094;</span>

  <div id="viewport">
    <div id="pan-container">
      <img id="lightbox-img" src="">
    </div>
  </div>

  <div id="zoom-controls">
    <span>-</span>
    <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1">
    <span>+</span>
  </div>

  <span id="next" class="nav">&#10095;</span>
</div>

<script>
  // --- SECURITY CONFIG ---

  // Tokens (T2)
  const VALID_TOKENS = {
    "tkn_8F92k3Q": "CLADDING",
    "tkn_AA91ff2Z": "ROOF",
    "tkn_ZKQ92Lx7": "GUEST"
  };

  // Simple "encryption": store base64 of PINs
  const ENCRYPTED_PINS = {
    "CLADDING": btoa("8346"),
    "ROOF":     btoa("7654"),
    "GUEST":    btoa("2975")
  };

  let attempts = 0;
  let lockedUntil = null;

  const pinOverlay = document.getElementById("pin-overlay");
  const pinInput   = document.getElementById("pin-input");
  const pinSubmit  = document.getElementById("pin-submit");
  const pinError   = document.getElementById("pin-error");
  const pinDenied  = document.getElementById("pin-denied");

  // Get token from URL
  const params = new URLSearchParams(window.location.search);
  const token  = params.get("token");
  const accessRole = token && VALID_TOKENS[token] ? VALID_TOKENS[token] : null;

  if (!accessRole) {
    // Invalid or missing token: deny access, keep overlay
    pinInput.disabled = true;
    pinSubmit.disabled = true;
    pinDenied.style.display = "block";
    pinError.textContent = "";
  }

  function checkLockout() {
    if (!lockedUntil) return false;
    const now = Date.now();
    if (now < lockedUntil) {
      const remaining = Math.ceil((lockedUntil - now) / 60000);
      pinError.textContent = `Too many attempts. Try again in ~${remaining} minute(s).`;
      return true;
    } else {
      lockedUntil = null;
      attempts = 0;
      return false;
    }
  }

  function handlePinSubmit() {
    if (!accessRole) return;

    if (checkLockout()) return;

    const entered = pinInput.value.trim();
    if (!entered) {
      pinError.textContent = "Please enter a PIN.";
      return;
    }

    const encryptedEntered = btoa(entered);
    const expectedEncrypted = ENCRYPTED_PINS[accessRole];

    if (encryptedEntered === expectedEncrypted) {
      // Correct PIN: unlock page
      pinOverlay.style.display = "none";
      pinError.textContent = "";
      attempts = 0;
    } else {
      attempts++;
      if (attempts >= 5) {
        lockedUntil = Date.now() + 10 * 60 * 1000; // 10 minutes
        pinError.textContent = "Too many incorrect attempts. Locked for 10 minutes.";
      } else {
        pinError.textContent = `Incorrect PIN (attempt ${attempts}/5).`;
      }
    }
  }

  pinSubmit.addEventListener("click", handlePinSubmit);
  pinInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handlePinSubmit();
  });

  // --- LIGHTBOX / GALLERY ---

  const images = [...document.querySelectorAll('.thumb')];
  const lightbox = document.getElementById('lightbox');
  const panContainer = document.getElementById('pan-container');
  const lightboxImg = document.getElementById('lightbox-img');
  const zoomSlider = document.getElementById('zoom-slider');

  let index = 0;
  let isDragging = false;
  let startX, startY;
  let offsetX = 0, offsetY = 0;

  function resetImage() {
    offsetX = 0;
    offsetY = 0;
    zoomSlider.value = 1;
    panContainer.style.transform = `translate(0px, 0px) scale(1)`;
  }

  function showLightbox(i) {
    index = i;
    lightboxImg.src = images[i].src;
    resetImage();
    lightbox.style.display = 'flex';
  }

  images.forEach((img, i) => {
    img.addEventListener('click', () => showLightbox(i));
  });

  document.getElementById('close').onclick = () => {
    lightbox.style.display = 'none';
  };

  document.getElementById('next').onclick = () => {
    index = (index + 1) % images.length;
    showLightbox(index);
  };

  document.getElementById('prev').onclick = () => {
    index = (index - 1 + images.length) % images.length;
    showLightbox(index);
  };

  zoomSlider.addEventListener('input', () => {
    const zoom = zoomSlider.value;
    panContainer.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${zoom})`;
  });

  panContainer.addEventListener('mousedown', (e) => {
    if (zoomSlider.value > 1) {
      isDragging = true;
      startX = e.clientX - offsetX;
      startY = e.clientY - offsetY;
      panContainer.style.cursor = "grabbing";
    }
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
    panContainer.style.cursor = "grab";
  });

  document.addEventListener('mousemove', (e) => {
    if (isDragging) {
      offsetX = e.clientX - startX;
      offsetY = e.clientY - startY;
      panContainer.style.transform =
        `translate(${offsetX}px, ${offsetY}px) scale(${zoomSlider.value})`;
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') lightbox.style.display = 'none';
    if (e.key === 'ArrowRight') document.getElementById('next').click();
    if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  });
</script>

</body>
</html>
